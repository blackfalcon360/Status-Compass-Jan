plugins {
    id 'com.android.application'
}

android {
    namespace 'statuscompass.blackfalcon.jan'
    compileSdk 34

    defaultConfig {
        applicationId "statuscompass.blackfalcon.jan"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // APK file name: "Statusbar Compass.apk"
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Statusbar Compass.apk"
        }
    }
}
